name: Capstone CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Upload surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/**

  image:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/Team_D/crm-api:${GITHUB_SHA} .

      - name: Push image
        run: docker push ghcr.io/Team_D/crm-api:${GITHUB_SHA}

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/Team_D/crm-api:${GITHUB_SHA})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Print digest
        run: echo "Image digest is ${{ steps.digest.outputs.digest }}"

      - name: Save digest
        run: |
          echo "${{ steps.digest.outputs.digest }}" > image-digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
