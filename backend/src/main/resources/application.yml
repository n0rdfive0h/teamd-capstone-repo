spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: crm_user
    password: crm_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/crm}

# HS256 secret shared by login (token minting) and request auth (token validation).
# Dev-only default lives in SecurityConfig; override in every real environment via a k8s secret.
crm:
  jwt:
    secret: ${CRM_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-in-prod}
          
  management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:crm;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: "!test"
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
