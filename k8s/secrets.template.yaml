apiVersion: v1
kind: Secret
metadata:
  name: crm-api-secrets
  namespace: training
type: Opaque
data:
  # Base64-encoded values. Generate via:
  # echo -n 'your-secret-value' | base64
  
  CRM_JWT_SECRET: "<base64-encoded-jwt-secret>"
  DB_URL: "<base64-encoded-db-url>"
  DB_USER: "<base64-encoded-db-user>"
  DB_PASSWORD: "<base64-encoded-db-password>"
  JWT_ISSUER_URI: "<base64-encoded-issuer-uri>"
  KAFKA_BOOTSTRAP_SERVERS: "<base64-encoded-kafka-servers>"
---
# Usage in deployment:
# valueFrom:
#   secretKeyRef:
#     name: crm-api-secrets
#     key: CRM_JWT_SECRET
