# Lab 51 k8s stub — dry-run friendly. Fill TODOs before apply on instructor k3s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
  labels:
    app: crm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
    spec:
      serviceAccountName: crm-api-sa
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: crm-api
          # TODO: replace with immutable digest from pipeline
          image: ghcr.io/Team_D/crm-api:sha256:d1666c342aaeea46a1db2436d918d58a230bcab3b18994718bda697723f98a84
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-api-secrets
                  key: DB_PASSWORD
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: crm-api-secrets
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: crm-api-secrets
                  key: DB_USER
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                secretKeyRef:
                  name: crm-api-secrets
                  key: KAFKA_BOOTSTRAP
            - name: JWT_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: crm-api-secrets
                  key: JWT_ISSUER_URI
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # TODO: point probes at real actuator / health paths
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api
spec:
  selector:
    app: crm-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
